name = "terpedex-api"
main = "src/index.js"
compatibility_date = "2026-01-01"

[vars]
# Pages allowed to write to the shared database.
ALLOWED_ORIGINS = "https://rickyracksasmr.github.io"
# Local testing adds http://localhost:4747 through .dev.vars, which is not committed.

[[d1_databases]]
binding = "DB"
database_name = "terpedex"
# Created with `npx wrangler d1 create terpedex`.
database_id = "90a4e60c-03d8-421d-96e1-12c65688f48e"

# Workers AI, used to write strain reference notes. Capped in src/index.js.
[ai]
binding = "AI"
remote = true
